# 本地演示 ACL：最小权限原则。
# backend 只订阅设备上行；device-sim 只发布已知设备的 heartbeat/status/telemetry。
# 真机接入时按 deviceCode 拆独立用户与更细 topic。

user backend
topic read skytrace/+/device/+/#
# 共享订阅的 ACL 主题名带 $share 前缀，和普通订阅不是同一条规则。
topic read $share/skytrace-backend/skytrace/+/device/+/#

user device-sim
topic write skytrace/+/device/+/heartbeat
topic write skytrace/+/device/+/status
topic write skytrace/+/device/+/telemetry
