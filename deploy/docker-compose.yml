services:
  mysql:
    image: mysql:8.4
    container_name: skytrace-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    container_name: skytrace-redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: skytrace-qdrant
    restart: always
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: skytrace-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skytrace_admin}
      POSTGRES_USER: ${POSTGRES_USER:-admin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123456}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-admin_user}", "-d", "${POSTGRES_DB:-skytrace_admin}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4-management
    container_name: skytrace-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: skytrace-minio
    restart: always
    command: server /data --console-address ":9002"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9011}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9012}:9002"
    volumes:
      - minio_data:/data
    networks:
      - backend

  temporal:
    image: temporalio/auto-setup:latest
    container_name: skytrace-temporal
    restart: always
    environment:
      DB: mysql8
      DB_PORT: 3306
      MYSQL_SEEDS: mysql
      MYSQL_USER: root
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "127.0.0.1:${TEMPORAL_HOST_PORT:-7233}:7233"
    volumes:
      - ./temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

  temporal-ui:
    image: temporalio/ui:latest
    container_name: skytrace-temporal-ui
    restart: always
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8888}
    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT:-8088}:8080"
    depends_on:
      - temporal
    networks:
      - backend

  backend-ai:
    build:
      context: ../backend-ai
    container_name: skytrace-backend-ai
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AI_OLLAMA_BASE_URL: http://host.docker.internal:${AI_OLLAMA_PORT:-11434}
      AI_OLLAMA_MODEL: ${AI_OLLAMA_MODEL:-my-drone-expert}
      AI_OLLAMA_EMBEDDING_MODEL: ${AI_OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      AI_OLLAMA_TIMEOUT_SECONDS: ${AI_OLLAMA_TIMEOUT_SECONDS:-120}
      AI_OLLAMA_MAX_ATTEMPTS: ${AI_OLLAMA_MAX_ATTEMPTS:-2}
      AI_OLLAMA_INITIAL_BACKOFF_SECONDS: ${AI_OLLAMA_INITIAL_BACKOFF_SECONDS:-0.5}
      AI_OLLAMA_MAX_BACKOFF_SECONDS: ${AI_OLLAMA_MAX_BACKOFF_SECONDS:-2}
      AI_DEPENDENCY_HEALTH_TIMEOUT_SECONDS: ${AI_DEPENDENCY_HEALTH_TIMEOUT_SECONDS:-5}
      AI_REDIS_URL: redis://redis:6379/0
      AI_QDRANT_URL: http://qdrant:6333
      AI_QDRANT_COLLECTION: ${AI_QDRANT_COLLECTION:-skytrace_knowledge}
      AI_CHAT_HISTORY_TURNS: ${AI_CHAT_HISTORY_TURNS:-6}
      AI_CHAT_SESSION_TTL_SECONDS: ${AI_CHAT_SESSION_TTL_SECONDS:-86400}
      AI_KNOWLEDGE_CHUNK_SIZE: ${AI_KNOWLEDGE_CHUNK_SIZE:-800}
      AI_KNOWLEDGE_CHUNK_OVERLAP: ${AI_KNOWLEDGE_CHUNK_OVERLAP:-120}
      AI_KNOWLEDGE_TOP_K: ${AI_KNOWLEDGE_TOP_K:-4}
      AI_KNOWLEDGE_SCORE_THRESHOLD: ${AI_KNOWLEDGE_SCORE_THRESHOLD:-0.25}
      AI_KNOWLEDGE_MAX_FILE_SIZE_BYTES: ${AI_KNOWLEDGE_MAX_FILE_SIZE_BYTES:-10485760}
      AI_RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      AI_MESSAGING_ENABLED: "true"
      AI_VISION_ENABLED: ${AI_VISION_ENABLED:-true}
      AI_VISION_BACKEND: ${AI_VISION_BACKEND:-mock}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-yolo26n.pt}
      AI_VISION_DEVICE: ${AI_VISION_DEVICE:-cpu}
      AI_VISION_CONFIDENCE_THRESHOLD: ${AI_VISION_CONFIDENCE_THRESHOLD:-0.35}
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      rabbitmq:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=5)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  backend-java:
    build:
      context: ../backend-java
    container_name: skytrace-backend-java
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USERNAME: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_EVIDENCE_BUCKET: ${MINIO_EVIDENCE_BUCKET:-skytrace-evidence}
      MINIO_ENABLED: "true"
      MESSAGING_ENABLED: "true"
      CACHE_ENABLED: "true"
      CACHE_ALARM_TTL_SECONDS: ${CACHE_ALARM_TTL_SECONDS:-30}
      CACHE_DEVICE_PRESENCE_TTL_SECONDS: ${CACHE_DEVICE_PRESENCE_TTL_SECONDS:-90}
      TEMPORAL_TARGET_ENDPOINT: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: skytrace-inspection-task-queue
      APP_SECURITY_ENABLED: ${BACKEND_SECURITY_ENABLED:-true}
      AUTH_JWT_JWK_SET_URI: ${GATEWAY_JWT_JWK_SET_URI:-http://keycloak:8080/realms/skytrace/protocol/openid-connect/certs}
      AUTH_JWT_ISSUER_URI: ${GATEWAY_JWT_ISSUER_URI:-http://localhost:8180/realms/skytrace}
      AUTH_JWT_AUDIENCE: ${GATEWAY_JWT_AUDIENCE:-skytrace-web}
      AUTH_JWT_CLIENT_ID: ${GATEWAY_JWT_CLIENT_ID:-skytrace-web}
      AI_BASE_URL: http://host.docker.internal:${AI_SERVICE_PORT:-8000}
      AI_CONNECT_TIMEOUT: ${AI_CONNECT_TIMEOUT:-3s}
      AI_READ_TIMEOUT: ${AI_READ_TIMEOUT:-250s}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-2}
      AI_INITIAL_BACKOFF: ${AI_INITIAL_BACKOFF:-500ms}
      AI_MAX_BACKOFF: ${AI_MAX_BACKOFF:-2s}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${JAVA_PORT}:8080"
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      temporal:
        condition: service_started
      backend-ai:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - backend

  backend-node:
    build:
      context: ../backend-node
    container_name: skytrace-backend-node
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      WS_PORT: 3001
      JAVA_BASE_URL: http://backend-java:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_JWT_JWK_SET_URI: ${GATEWAY_JWT_JWK_SET_URI:-http://keycloak:8080/realms/skytrace/protocol/openid-connect/certs}
      AUTH_JWT_ISSUER_URI: ${GATEWAY_JWT_ISSUER_URI:-http://localhost:8180/realms/skytrace}
      AUTH_JWT_AUDIENCE: ${GATEWAY_JWT_AUDIENCE:-skytrace-web}
      WS_ALLOWED_ORIGIN: ${GATEWAY_ALLOWED_ORIGIN:-http://localhost:8888,http://127.0.0.1:8888}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      MESSAGING_ENABLED: "true"
    ports:
      - "127.0.0.1:${NODE_PORT}:3000"
      - "127.0.0.1:${WS_PORT}:3001"
    expose:
      - "3000"
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend-java:
        condition: service_started
      keycloak:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - backend

  gateway:
    build:
      context: ../gateway-java
    container_name: skytrace-gateway
    restart: always
    environment:
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      NODE_BFF_URL: http://backend-node:3000
      NODE_WS_URL: ws://backend-node:3001
      NODE_WS_HTTP_URL: http://backend-node:3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_ALLOWED_ORIGIN: ${GATEWAY_ALLOWED_ORIGIN:-http://localhost:8888}
      GATEWAY_SECURITY_ENABLED: ${GATEWAY_SECURITY_ENABLED:-true}
      GATEWAY_JWT_JWK_SET_URI: ${GATEWAY_JWT_JWK_SET_URI:-http://keycloak:8080/realms/skytrace/protocol/openid-connect/certs}
      GATEWAY_JWT_ISSUER_URI: ${GATEWAY_JWT_ISSUER_URI:-http://localhost:8180/realms/skytrace}
      GATEWAY_JWT_AUDIENCE: ${GATEWAY_JWT_AUDIENCE:-skytrace-web}
      GATEWAY_JWT_CLIENT_ID: ${GATEWAY_JWT_CLIENT_ID:-skytrace-web}
      GATEWAY_RATE_LIMIT_REPLENISH_RATE: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE:-20}
      GATEWAY_RATE_LIMIT_BURST_CAPACITY: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY:-40}
      GATEWAY_AI_RATE_LIMIT_REPLENISH_RATE: ${GATEWAY_AI_RATE_LIMIT_REPLENISH_RATE:-1}
      GATEWAY_AI_RATE_LIMIT_BURST_CAPACITY: ${GATEWAY_AI_RATE_LIMIT_BURST_CAPACITY:-2}
      GATEWAY_KNOWLEDGE_RATE_LIMIT_REPLENISH_RATE: ${GATEWAY_KNOWLEDGE_RATE_LIMIT_REPLENISH_RATE:-5}
      GATEWAY_KNOWLEDGE_RATE_LIMIT_BURST_CAPACITY: ${GATEWAY_KNOWLEDGE_RATE_LIMIT_BURST_CAPACITY:-10}
      GATEWAY_WS_RATE_LIMIT_REPLENISH_RATE: ${GATEWAY_WS_RATE_LIMIT_REPLENISH_RATE:-5}
      GATEWAY_WS_RATE_LIMIT_BURST_CAPACITY: ${GATEWAY_WS_RATE_LIMIT_BURST_CAPACITY:-10}
      GATEWAY_TRUSTED_PROXY_COUNT: ${GATEWAY_TRUSTED_PROXY_COUNT:-1}
      GATEWAY_MAX_REQUEST_SIZE: ${GATEWAY_MAX_REQUEST_SIZE:-20MB}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8082}:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      backend-node:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - edge
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: skytrace-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-before-start}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      SKYTRACE_SERVICE_CLIENT_SECRET: ${KEYCLOAK_SERVICE_CLIENT_SECRET:-}
      SKYTRACE_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD:-}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/skytrace-realm.json:/opt/keycloak/data/import/skytrace-realm.json:ro
    networks:
      - edge
      - backend

  admin-service:
    build:
      context: ../admin-service
    container_name: skytrace-admin-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin_user}:${POSTGRES_PASSWORD:-admin123456}@postgres:5432/${POSTGRES_DB:-skytrace_admin}
      JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET in deploy/.env}
      JWT_REFRESH_SECRET: ${ADMIN_JWT_REFRESH_SECRET:?Set ADMIN_JWT_REFRESH_SECRET in deploy/.env}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_ADMIN_BUCKET: ${MINIO_ADMIN_BUCKET:-admin-avatars}
    ports:
      - "127.0.0.1:${ADMIN_SERVICE_PORT:-3100}:3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/admin-api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  admin-frontend:
    build:
      context: ../admin-frontend
    container_name: skytrace-admin-frontend
    restart: always
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
    ports:
      - "127.0.0.1:${ADMIN_FRONTEND_PORT:-8889}:80"
    depends_on:
      admin-service:
        condition: service_healthy
    networks:
      - edge
      - backend

  frontend:
    build:
      context: ../frontend
    container_name: skytrace-frontend
    restart: always
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8180}
      KEYCLOAK_REALM: skytrace
      KEYCLOAK_CLIENT_ID: skytrace-web
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8888}:80"
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      gateway:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      # edge: 对外端口；backend: 解析 gateway/minio（nginx 启动时会解析 proxy_pass 主机名）
      - edge
      - backend

volumes:
  mysql_data:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  keycloak_data:
  qdrant_data:

networks:
  edge:
    name: skytrace-edge
  backend:
    name: skytrace-backend
