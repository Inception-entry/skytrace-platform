# Vision overlay: real YOLO for local builds; required for staging/prod runtime.
#
# Local (build with ultralytics):
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.vision.yml \
#                  up -d --build backend-ai
#
# Staging / production deploy scripts always include this file so
# AI_VISION_BACKEND defaults to yolo26. CI and plain local compose stay on mock.

services:
  backend-ai:
    build:
      context: ../backend-ai
      args:
        INSTALL_VISION: "1"
    environment:
      AI_VISION_BACKEND: ${AI_VISION_BACKEND:-yolo26}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-yolo26n.pt}
      AI_VISION_DEVICE: ${AI_VISION_DEVICE:-cpu}
      AI_VISION_CONFIDENCE_THRESHOLD: ${AI_VISION_CONFIDENCE_THRESHOLD:-0.35}
