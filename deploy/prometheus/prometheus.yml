global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:8080']

  # backend-java context-path is /api, so actuator is at /api/actuator
  - job_name: backend-java
    metrics_path: /api/actuator/prometheus
    static_configs:
      - targets: ['backend-java:8080']

  - job_name: backend-node
    metrics_path: /metrics
    static_configs:
      - targets: ['backend-node:3000']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: admin-service
    metrics_path: /metrics
    static_configs:
      - targets: ['admin-service:3000']
