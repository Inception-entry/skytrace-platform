name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.service }}
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend-ai
            context: backend-ai
          - service: backend-java
            context: backend-java
          - service: backend-node
            context: backend-node
          - service: gateway
            context: gateway-java
          - service: frontend
            context: frontend
          - service: admin-service
            context: admin-service
          - service: admin-frontend
            context: admin-frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=main-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_KEYCLOAK_URL=${{ secrets.STAGING_KEYCLOAK_URL }}
            INSTALL_VISION=${{ matrix.service == 'backend-ai' && '1' || '0' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  digest-manifest:
    name: Release digest manifest
    needs: publish
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Inspect pushed tags and write digest manifest
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TAG="main-${HEAD_SHA:0:7}"
          python3 scripts/release_manifest.py inspect \
            --registry "$REGISTRY" \
            --tag "$TAG" \
            --output release-manifest.json
          python3 scripts/release_manifest.py validate \
            --manifest release-manifest.json \
            --expect-tag "$TAG"
          python3 scripts/release_sbom.py generate \
            --manifest release-manifest.json \
            --registry "$REGISTRY" \
            --output-dir sbom

      - uses: actions/upload-artifact@v4
        with:
          name: release-digest-manifest
          path: |
            release-manifest.json
            sbom/
