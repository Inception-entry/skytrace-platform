name: Deploy (test)

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to test environment
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    steps:
      - name: Check whether test deployment is configured
        id: config
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
          TEST_SSH_KEY: ${{ secrets.TEST_SSH_KEY }}
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          missing=()
          for name in TEST_SSH_HOST TEST_SSH_USER TEST_SSH_KEY STAGING_DOMAIN; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Test deploy skipped::No test server configured (missing: ${missing[*]})."
            echo "Local development: ./scripts/skytrace.sh rebuild"
            echo "To enable remote deploy later: Settings → Environments → test → add the secrets above,"
            echo "then run scripts/staging-init.sh on the test server."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Compute image tag
        if: steps.config.outputs.enabled == 'true'
        id: tag
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          echo "value=main-${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        if: steps.config.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_SSH_HOST }}
          username: ${{ secrets.TEST_SSH_USER }}
          key: ${{ secrets.TEST_SSH_KEY }}
          envs: IMAGE_TAG,REGISTRY,UAV_DOMAIN,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            cd /opt/uav
            git fetch origin main --quiet
            git reset --hard origin/main
            bash scripts/deploy-staging.sh
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          REGISTRY: ghcr.io/${{ github.repository }}
          UAV_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.repository_owner }}
