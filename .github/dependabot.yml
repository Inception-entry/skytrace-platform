version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /backend-java
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Boot 4 moves WebMvcTest/MockBean and ships Spring Data Redis 4.
      # Stay on 3.5.x until a dedicated upgrade PR.
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /gateway-java
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: ["version-update:semver-major"]
      # 2025.1.x is the Boot 4 generation (Gateway 5). Stay on 2025.0.x.
      - dependency-name: org.springframework.cloud:spring-cloud-dependencies
        versions: ["2025.1.x"]

  - package-ecosystem: npm
    directory: /backend-node
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Node runtime is 20; @types/node 26 is the Node 26 typings.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # CI Node is 22; @types/node 26 is the Node 26 typings.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 peers typescript >=4.8.4 <6.1.0; TS 7 has no compiler API yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # ESLint 9/10 need flat config; plugin-vue 9 and the current .eslintrc stay on 8.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Vite 8 needs @vitejs/plugin-vue 6 and Rolldown; stay on Vite 6.
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # v10 drops plugin:vue/vue3-essential and wants ESLint 9 + flat config.
      - dependency-name: eslint-plugin-vue
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend-ai
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /backend-java
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Spring Boot 3.5 / java.version 21. Major Temurin bumps drop curl
      # (compose healthcheck) and compile with unsupported JDKs.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /gateway-java
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend-node
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /backend-ai
    schedule:
      interval: weekly
      day: monday
