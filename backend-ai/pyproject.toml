[project]
name = "skytrace-backend-ai"
version = "1.2.1"
description = "SkyTrace AI service powered by LangChain and Ollama"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "langchain-ollama>=1,<2",
    "langchain-text-splitters>=1,<2",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "qdrant-client>=1.18,<2",
    "redis>=5,<8",
    "aio-pika>=9.4,<10",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]
vision = [
    "ultralytics>=8.3.200,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
