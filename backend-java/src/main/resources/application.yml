server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: skytrace-backend-java
  profiles:
    default: local
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  mvc:
    async:
      request-timeout: 300000
  servlet:
    multipart:
      # 单文件默认留在 Gateway/Nginx 20 MB 请求上限以内，为 multipart 边界预留空间。
      max-file-size: ${EVIDENCE_MAX_FILE_SIZE:19MB}
      max-request-size: ${EVIDENCE_MAX_REQUEST_SIZE:20MB}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
  temporal:
    connection:
      target: ${TEMPORAL_TARGET_ENDPOINT:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    workers:
      - task-queue: ${TEMPORAL_TASK_QUEUE:skytrace-inspection-task-queue}
        workflow-classes:
          - com.skytrace.backend.temporal.workflow.InspectionWorkflowImpl
          - com.skytrace.backend.temporal.workflow.InspectionAnalysisWorkflowImpl
          - com.skytrace.backend.temporal.workflow.InspectionChatWorkflowImpl
          - com.skytrace.backend.temporal.workflow.EvidenceDerivativeWorkflowImpl
          - com.skytrace.backend.temporal.workflow.EvidenceArchiveWorkflowImpl
        activity-beans:
          - inspectionTaskActivities
          - inspectionAnalysisActivities
          - evidenceDerivativeActivities
          - evidenceArchiveActivities
app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
    jwk-set-uri: ${AUTH_JWT_JWK_SET_URI:http://localhost:8180/realms/skytrace/protocol/openid-connect/certs}
    issuer-uri: ${AUTH_JWT_ISSUER_URI:http://localhost:8180/realms/skytrace}
    audience: ${AUTH_JWT_AUDIENCE:skytrace-web}
    client-id: ${AUTH_JWT_CLIENT_ID:skytrace-web}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
    read-timeout: ${AI_READ_TIMEOUT:250s}
    max-attempts: ${AI_MAX_ATTEMPTS:2}
    initial-backoff: ${AI_INITIAL_BACKOFF:500ms}
    max-backoff: ${AI_MAX_BACKOFF:2s}
  minio:
    enabled: ${MINIO_ENABLED:true}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9011}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9011}}
    region: ${MINIO_REGION:us-east-1}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    evidence-bucket: ${MINIO_EVIDENCE_BUCKET:skytrace-evidence}
    public-read-enabled: ${MINIO_PUBLIC_READ_ENABLED:false}
    presign-preview-ttl-seconds: ${MINIO_PRESIGN_PREVIEW_TTL_SECONDS:300}
    presign-download-ttl-seconds: ${MINIO_PRESIGN_DOWNLOAD_TTL_SECONDS:300}
    connect-timeout: ${MINIO_CONNECT_TIMEOUT:5s}
    read-timeout: ${MINIO_READ_TIMEOUT:5m}
    write-timeout: ${MINIO_WRITE_TIMEOUT:5m}
    archive-temp-dir: ${MINIO_ARCHIVE_TEMP_DIR:${java.io.tmpdir}/skytrace-evidence-archives}
  evidence:
    maintenance:
      hash-backfill-enabled: ${EVIDENCE_HASH_BACKFILL_ENABLED:false}
      hash-backfill-batch-size: ${EVIDENCE_HASH_BACKFILL_BATCH_SIZE:25}
      hash-backfill-retry-hours: ${EVIDENCE_HASH_BACKFILL_RETRY_HOURS:24}
      hash-backfill-fixed-delay-ms: ${EVIDENCE_HASH_BACKFILL_DELAY_MS:300000}
      hash-backfill-initial-delay-ms: ${EVIDENCE_HASH_BACKFILL_INITIAL_DELAY_MS:60000}
      cleanup-enabled: ${EVIDENCE_CLEANUP_ENABLED:false}
      cleanup-dry-run: ${EVIDENCE_CLEANUP_DRY_RUN:true}
      cleanup-retention-days: ${EVIDENCE_CLEANUP_RETENTION_DAYS:90}
      cleanup-batch-size: ${EVIDENCE_CLEANUP_BATCH_SIZE:20}
      cleanup-cron: "${EVIDENCE_CLEANUP_CRON:0 30 3 * * *}"
      cleanup-stale-claim-hours: ${EVIDENCE_CLEANUP_STALE_CLAIM_HOURS:6}
  messaging:
    enabled: ${MESSAGING_ENABLED:true}
  cache:
    enabled: ${CACHE_ENABLED:true}
    alarm-ttl-seconds: ${CACHE_ALARM_TTL_SECONDS:30}
    device-presence-ttl-seconds: ${CACHE_DEVICE_PRESENCE_TTL_SECONDS:90}
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    env: ${MQTT_ENV:local}
    client-id: ${MQTT_CLIENT_ID:skytrace-backend-java}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
