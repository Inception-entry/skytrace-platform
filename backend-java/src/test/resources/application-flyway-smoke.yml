spring:
  jpa:
    hibernate:
      ddl-auto: validate
  sql:
    init:
      encoding: UTF-8
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

app:
  messaging:
    enabled: false
  minio:
    enabled: false
  cache:
    enabled: false
  mqtt:
    enabled: false
